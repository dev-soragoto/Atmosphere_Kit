name: Atmosphere_Kit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "kit.toml"
      - "atmosphere_kit/**"
      - "resources/**"
      - ".github/workflows/switchScript.yaml"
  schedule:
    - cron: 0 8 * * 5

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "DATE=$(date "+%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
          echo "tag_name=$(date +%Y%m%d)" >> $GITHUB_ENV
          python -m atmosphere_kit

      - name: Read description.txt
        id: description
        uses: juliangruber/read-file-action@v1
        with:
          path: ./description.txt

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          name: Atmosphere_Kit_${{ env.tag_name }}
          allowUpdates: true
          tag: ${{ env.tag_name }}
          commit: main
          token: ${{ secrets.TOKEN }}
          body: "${{ steps.description.outputs.content }}"
          artifacts: "SwitchSD.zip"

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

      - name: Delete workflow runs for current repo
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ secrets.TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 6
